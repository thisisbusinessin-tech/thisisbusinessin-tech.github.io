<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apne Tailor</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #0f2027, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .container {
      animation: fadeUp 1.2s ease forwards;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.7;
      margin-bottom: 30px;
    }

    .badge {
      border: 1px solid #00e5ff;
      color: #00e5ff;
      display: inline-block;
      padding: 6px 18px;
      margin-bottom: 20px;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    footer a {
      color: #00e5ff;
      text-decoration: none;
      margin: 0 8px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="badge">COMING SOON</div>

    <h1>Apne Tailor</h1>

    <p>Stitching Made Simple. Pickup. Stitch. Deliver.</p>
  </div>

  <footer>
    © 2026 Apne Tailor. All rights reserved. <br><br>

    <a href="/privacy-policy">Privacy Policy</a> |
    <a href="/terms">Terms of Service</a>
  </footer>

</body>
</html>
